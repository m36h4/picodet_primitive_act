metric: COCO
num_classes: 1

TrainDataset:
  !COCODataSet
    image_dir: images/train
    anno_path: labels/train.json
    dataset_dir: train
    data_fields: ['image', 'gt_bbox', 'gt_class', 'is_crowd']

EvalDataset:
  !COCODataSet
    image_dir: images/val
    anno_path: labels/val.json
    dataset_dir: dataset
    data_fields: ['image', 'gt_bbox', 'gt_class', 'is_crowd']

TestDataset:
  !ImageFolder
    anno_path: labels/test.json
    dataset_dir: dataset/images/test
